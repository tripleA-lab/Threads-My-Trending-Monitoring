name: Threads Stealth Scraper Cron

on:
  workflow_dispatch: # Boleh tekan 'Run' secara manual bila-bila masa

  schedule:
    # Jalan 4 kali sehari ikut Waktu Malaysia (8am, 12pm, 6pm, 10pm)
    - cron: '0 0,4,10,14 * * *'

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Keperluan & Pelayar Web
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Jalankan Stealth Scraper & Seeder
        run: |
          # Suntik data awal jika database baru, kemudian crawl santai
          python scraper/threads_scraper.py --seed
          python scraper/threads_scraper.py --duration 45

      - name: Jana Laman Web index.html untuk GitHub Pages
        run: |
          python generate_html.py

      - name: Simpan Kemas Kini Database & Web ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add threads_data.db index.html || true
          git commit -m "chore: auto-update dashboard & viral posts [skip ci]" || exit 0
          git push
