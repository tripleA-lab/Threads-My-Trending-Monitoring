name: Threads Stealth Scraper Cron

on:
  # Membolehkan anda uji tekan butang 'Run' secara manual di tab Actions
  workflow_dispatch:

  # Jadual Automatik (Waktu Malaysia: 8am, 12pm, 6pm, 10pm)
  # 00:00 UTC = 8:00 AM MYT
  # 04:00 UTC = 12:00 PM MYT
  # 10:00 UTC = 6:00 PM MYT
  # 14:00 UTC = 10:00 PM MYT
  schedule:
    - cron: '0 0,4,10,14 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Keperluan & Pelayar Web
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Jalankan Stealth Scraper (< 1 Minit)
        run: |
          # Dijalankan dengan had masa maksimum 45 saat secara perlahan & santai
          python scraper/threads_scraper.py --duration 45

      - name: Simpan Kemas Kini Database ke Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add threads_data.db || true
          git commit -m "chore(data): auto-update trending threads [skip ci]" || exit 0
          git push
